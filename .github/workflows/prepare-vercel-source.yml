name: Prepare Vercel source

on:
  push:
    branches:
      - vercel-ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[skip extract]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract application
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/hapoel-source
          mkdir -p /tmp/hapoel-source
          unzip -q hapoel-schedule.zip -d /tmp/hapoel-source

          SOURCE_ROOT="$(find /tmp/hapoel-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_ROOT"

          rm -rf "$SOURCE_ROOT/.git" "$SOURCE_ROOT/prisma/dev.db" "$SOURCE_ROOT/tsconfig.tsbuildinfo"
          cp -a "$SOURCE_ROOT"/. .

          cat > vercel.json <<'EOF'
          {
            "installCommand": "npm install",
            "buildCommand": "npx prisma migrate deploy && next build"
          }
          EOF

          cat > .env.example <<'EOF'
          # PostgreSQL connection used by Prisma's pooled runtime client.
          POSTGRES_PRISMA_URL="postgresql://username:password@hostname:port/database?sslmode=require"

          # Direct PostgreSQL connection used by Prisma migrations.
          POSTGRES_URL_NON_POOLING="postgresql://username:password@hostname:port/database?sslmode=require"

          # Password for the /admin login.
          ADMIN_PASSWORD="change-this-in-production"

          # Long random secret used to sign admin sessions.
          AUTH_SECRET="generate-a-long-random-string"
          EOF

          cat > README.md <<'EOF'
          # Hapoel Schedule

          Next.js schedule management app for Hapoel Be'er Sheva.

          ## Stack

          - Next.js 16
          - React 19
          - Prisma
          - PostgreSQL
          - Vercel

          ## Local development

          1. Copy `.env.example` to `.env.local`.
          2. Set the PostgreSQL connection strings and a strong `ADMIN_PASSWORD` and `AUTH_SECRET`.
          3. Run `npm install`.
          4. Run `npx prisma migrate deploy`.
          5. Run `npm run dev`.

          ## Vercel

          Add these environment variables to the Vercel project:

          - `POSTGRES_PRISMA_URL`
          - `POSTGRES_URL_NON_POOLING`
          - `ADMIN_PASSWORD`
          - `AUTH_SECRET`

          The production build runs Prisma migrations before `next build`. Prisma Client is generated by the `postinstall` script.

          Never commit production credentials.
          EOF

          rm -f hapoel-schedule.zip

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract app and prepare for Vercel [skip extract]" || exit 0
          git pull --rebase origin vercel-ready
          git push
