# Apply Postgres migrations. Does not load the demo schedule.
# Demo practices/games are local-only (node scripts/seed-local.mjs) so they cannot
# replace the rows the live site and GitHub Pages display.
# Add repository secret NETLIFY_DATABASE_URL from Netlify → Project → Database → connection string.

name: Database (Postgres)

on:
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          NETLIFY_DATABASE_URL: ${{ secrets.NETLIFY_DATABASE_URL }}
          # Optional JSON array of { username, displayName, role, password }.
          # Unset or empty skips the manager seed. Do not echo this value.
          ADMIN_USERS_SEED: ${{ secrets.ADMIN_USERS_SEED }}
        run: npm run db:migrate:apply
